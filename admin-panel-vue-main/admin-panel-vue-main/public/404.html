<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Страница не найдена — AdMirra</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #16213e;
      background: linear-gradient(145deg, #eef3ff, #dbe6fb 55%, #eefaff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 48px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(42,76,145,.14);
      text-align: center;
    }
    strong { display: block; color: #2f6bff; font-size: 72px; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: 30px; }
    p { margin: 0 0 28px; color: #64718c; line-height: 1.55; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #2563eb, #1f9de4 68%, #06b5d4);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <strong>404</strong>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или в ссылке есть ошибка.</p>
    <a href="/">Вернуться на главную</a>
  </main>
</body>
</html>
