groups:
  - name: admirra-production
    rules:
      - alert: AdMirraDurableRuntimeUnhealthy
        expr: admirra_runtime_monitor_ok == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra worker/scheduler or durable delivery ledger requires attention"
          runbook: "docs/devops-production-cutover-2026-09-24.md"

      - alert: AdMirraDurableRuntimeMonitorStale
        expr: time() - admirra_runtime_monitor_timestamp_seconds > 180 or absent(admirra_runtime_monitor_timestamp_seconds{role="ingress"}) or absent(admirra_runtime_monitor_timestamp_seconds{role="workers"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra durable runtime monitoring stopped updating"
          runbook: "docs/devops-production-cutover-2026-09-24.md"

      - alert: AdMirraManualQueueDelay
        expr: admirra_runtime_value{role="ingress",name="manual_wait"} > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra manual synchronization queue is delayed"
          runbook: "docs/devops-production-cutover-2026-09-24.md"

      - alert: AdMirraSharedFilesUnavailable
        expr: admirra_shared_files_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra private file transport is unavailable"
          runbook: "docs/devops-worker-files-2026-09-24.md"

      - alert: AdMirraSharedFilesMonitorStale
        expr: time() - admirra_shared_files_last_check_timestamp_seconds > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra file health monitor stopped updating"
          runbook: "docs/devops-worker-files-2026-09-24.md"

      - alert: AdMirraArtifactCertificateExpiring
        expr: admirra_shared_files_certificate_not_after_timestamp_seconds - time() < 2592000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra file-service certificate expires in less than 30 days"
          runbook: "docs/devops-worker-files-2026-09-24.md"

      - alert: AdMirraNodeExporterDown
        expr: up{job="nodes"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra node metrics are unavailable"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraCanaryMonitorFailed
        expr: admirra_api2_monitor_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API-2 canary health guard is failing"
          runbook: "docs/devops-api2-monitor-2026-09-20.md"

      - alert: AdMirraCanaryMonitorStale
        expr: time() - admirra_api2_monitor_last_check_timestamp_seconds > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API-2 canary health guard stopped updating"
          runbook: "docs/devops-api2-monitor-2026-09-20.md"

      - alert: AdMirraRootDiskFreeLow
        expr: node_filesystem_avail_bytes{job="nodes",mountpoint="/"} / node_filesystem_size_bytes{job="nodes",mountpoint="/"} < 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra root filesystem has less than 20% free"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraRootDiskFreeCritical
        expr: node_filesystem_avail_bytes{job="nodes",mountpoint="/"} / node_filesystem_size_bytes{job="nodes",mountpoint="/"} < 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra root filesystem has less than 10% free"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraMemoryAvailableLow
        expr: node_memory_MemAvailable_bytes{job="nodes"} / node_memory_MemTotal_bytes{job="nodes"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra node has less than 15% available memory"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraCanaryFinal5xx
        expr: admirra_api2_monitor_value{role="ingress",name="canary_final_5xx_window"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "API-2 canary produced final 5xx responses"
          runbook: "docs/devops-api2-canary-2026-09-20.md"

      - alert: AdMirraCanaryFallback
        expr: admirra_api2_monitor_value{role="ingress",name="canary_fallbacks_window"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API-2 canary required fallback to API-1"
          runbook: "docs/devops-api2-canary-2026-09-20.md"

      - alert: AdMirraWireGuardHandshakeStale
        expr: admirra_api2_monitor_value{name="wireguard_handshake_age_seconds"} < 0 or admirra_api2_monitor_value{name="wireguard_handshake_age_seconds"} > 600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra private WireGuard link is stale"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraApi2ContainerRestarted
        expr: admirra_api2_monitor_value{role="api2",name="api2_container_restarts"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API-2 container restart counter is non-zero"
          runbook: "docs/devops-api2-monitor-2026-09-20.md"

      - alert: AdMirraPostgresExporterDown
        expr: pg_up{job="postgres"} == 0 or up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra PostgreSQL monitoring connection is down"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{datname="saas_project"}) / scalar(pg_settings_max_connections) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra PostgreSQL connections exceed 80%"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraPostgresIdleInTransaction
        expr: sum(pg_stat_activity_count{datname="saas_project",state=~"idle in transaction.*"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra PostgreSQL has idle transactions"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraPostgresLongTransaction
        expr: pg_long_running_transactions > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra PostgreSQL has a long-running transaction"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraPostgresDeadlock
        expr: increase(pg_stat_database_deadlocks{datname="saas_project"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra PostgreSQL registered a deadlock"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraRedisExporterDown
        expr: redis_up{job="redis"} == 0 or up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra Redis monitoring connection is down"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraRedisBrokerEviction
        expr: increase(redis_evicted_keys_total{job="redis",redis_role="broker"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra broker Redis evicted keys"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraRedisMemoryHigh
        expr: redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AdMirra Redis memory exceeds 75%"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraRedisAofFailure
        expr: redis_aof_last_bgrewrite_status{job="redis",redis_role="broker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra broker Redis AOF rewrite failed"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraLogicalBackupStale
        expr: admirra_api2_monitor_value{role="api2",name="logical_backup_age_seconds"} < 0 or admirra_api2_monitor_value{role="api2",name="logical_backup_age_seconds"} > 108000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdMirra encrypted logical backup is missing or stale"
          runbook: "docs/devops-backup-2026-09-20.md"

      - alert: AdMirraAlertmanagerUnavailable
        expr: prometheus_notifications_alertmanagers_discovered < 1 or up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot discover the local Alertmanager"
          runbook: "docs/devops-observability-2026-09-20.md"

      - alert: AdMirraTelegramDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total{integration="telegram"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager could not deliver a Telegram notification; inspect token/network/permissions"
          runbook: "docs/devops-telegram-alerts-2026-09-20.md"

      - alert: AdMirraAlertDeliveryFailed
        expr: increase(prometheus_notifications_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus failed to deliver alerts to Alertmanager"
          runbook: "docs/devops-observability-2026-09-20.md"
