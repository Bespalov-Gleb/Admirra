services:
  redis-broker-exporter:
    image: quay.io/oliver006/redis_exporter@sha256:fed773ffd2bb2eac706e0ed9cc2fff41651193ee4977e2a4f6919658ad2313f4
    container_name: admirra-redis-broker-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: redis://10.77.0.2:6379
      REDIS_USER: monitor
      REDIS_PASSWORD_FILE: /run/secrets/redis_passwords.json
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 10.77.0.2:9121
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 3s
      REDIS_EXPORTER_LOG_LEVEL: warning
    volumes:
      - /etc/admirra/monitoring/redis_broker_passwords.json:/run/secrets/redis_passwords.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis-cache-exporter:
    image: quay.io/oliver006/redis_exporter@sha256:fed773ffd2bb2eac706e0ed9cc2fff41651193ee4977e2a4f6919658ad2313f4
    container_name: admirra-redis-cache-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: redis://10.77.0.2:6380
      REDIS_USER: monitor
      REDIS_PASSWORD_FILE: /run/secrets/redis_passwords.json
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 10.77.0.2:9122
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 3s
      REDIS_EXPORTER_LOG_LEVEL: warning
    volumes:
      - /etc/admirra/monitoring/redis_cache_passwords.json:/run/secrets/redis_passwords.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
