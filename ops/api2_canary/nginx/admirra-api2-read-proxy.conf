proxy_pass http://admirra_api_read_canary;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 1s;
# These four canary routes are small reads. A dead established WireGuard
# socket must fail over before a normal browser/client timeout expires.
proxy_read_timeout 2s;
proxy_send_timeout 2s;
proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 4s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
access_log /var/log/nginx/admirra-api2-canary.log admirra_api_canary;
