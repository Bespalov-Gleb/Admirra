upstream admirra_api_read_canary {
    least_conn;
    server 127.0.0.1:8001 weight=9 max_fails=3 fail_timeout=5s;
    server 10.77.0.2:8001 weight=1 max_fails=3 fail_timeout=5s;
    keepalive 16;
    # Uvicorn closes idle connections after 5s. Retire pooled sockets first.
    keepalive_timeout 3s;
}

log_format admirra_api_canary '$time_iso8601 request_id=$request_id '
    'method=$request_method uri=$uri status=$status '
    'upstream=$upstream_addr upstream_status=$upstream_status '
    'request_time=$request_time upstream_time=$upstream_response_time';
