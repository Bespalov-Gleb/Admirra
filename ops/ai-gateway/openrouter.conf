# Only reachable over the dedicated WireGuard link; not a public forward proxy.
limit_conn_zone $server_name zone=ai_gateway_total:1m;
limit_req_zone $binary_remote_addr zone=telegram_alerts:1m rate=1r/s;
log_format ai_gateway escape=json '{"time":"$time_iso8601","status":$status,"upstream":"$upstream_status","seconds":$request_time,"upstream_seconds":"$upstream_response_time","bytes":$body_bytes_sent}';

server {
    listen 10.78.0.3:8080;
    server_name _;
    allow 10.78.0.1;
    allow 10.78.0.2;
    deny all;
    access_log /var/log/nginx/ai-gateway-access.log ai_gateway;
    error_log /var/log/nginx/ai-gateway-error.log warn;
    server_tokens off;
    client_max_body_size 8m;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    send_timeout 180s;
    keepalive_timeout 30s;
    limit_conn ai_gateway_total 100;
    limit_conn_status 429;

    include /etc/nginx/snippets/admirra-telegram-location.conf;

    # Use access phase (not 'return 200', which would bypass allow/deny).
    location = /healthz {
        alias /var/lib/admirra-ai-gateway/healthz;
        default_type application/json;
        limit_except GET { deny all; }
    }
    location = /api/v1/models {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/admirra-openrouter-proxy.conf;
    }
    location = /api/v1/key {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/admirra-openrouter-proxy.conf;
    }
    location = /api/v1/chat/completions {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/admirra-openrouter-proxy.conf;
    }
    location / { return 404; }
}
