# Native Alertmanager Bot API egress, only from API-1 over encrypted WireGuard.
# No arbitrary host/path/CONNECT; the token-bearing URI must never enter logs.
location ~ "^/telegram/bot[0-9]+:[A-Za-z0-9_-]+/sendMessage$" {
    allow 10.78.0.1;
    deny all;
    limit_except POST { deny all; }
    if ($args != "") { return 400; }
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    limit_req zone=telegram_alerts burst=10 nodelay;
    limit_req_status 429;
    # Access uses the parent status/timing-only format. Nginx error messages
    # can embed request/upstream URLs including the bot token; disable here.
    error_log /dev/null crit;
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 5s;
    set $telegram_upstream api.telegram.org;
    rewrite ^/telegram(/.*)$ $1 break;
    proxy_pass https://$telegram_upstream$uri;
    proxy_http_version 1.1;
    proxy_set_header Host api.telegram.org;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_ssl_server_name on;
    proxy_ssl_name api.telegram.org;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    proxy_intercept_errors off;
}

location /telegram/ {
    error_log /dev/null crit;
    return 404;
}
