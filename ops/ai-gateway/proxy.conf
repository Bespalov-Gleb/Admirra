# Fixed upstream + runtime DNS: user input cannot select another destination.
resolver 127.0.0.53 valid=60s ipv6=off;
resolver_timeout 5s;
set $ai_upstream openrouter.ai;
proxy_pass https://$ai_upstream$request_uri;
proxy_http_version 1.1;
proxy_set_header Host openrouter.ai;
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_ssl_server_name on;
proxy_ssl_name openrouter.ai;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 10s;
proxy_send_timeout 180s;
proxy_read_timeout 180s;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_max_temp_file_size 0;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_ignore_client_abort off;
add_header X-Accel-Buffering no always;
