# PREPARED configuration, not a command to cut over a running production stack.
# Requires private link, migrated DB, reviewed /etc/admirra files and restore drill.
name: admirra-workers
x-worker: &worker
  image: ${ADMIRRA_IMAGE:?Set a tested immutable image digest}
  env_file:
    - path: /etc/admirra/worker.env
      format: raw
    - path: /etc/admirra/redis-worker.env
      format: raw
  environment: &runtime
    APP_PROCESS_ROLE: worker
    DURABLE_TASKS: "true"
    REPORT_DELIVERY_GUARDS: "true"
    DISTRIBUTED_RATE_LIMITS: "true"
    DB_AUTO_BOOTSTRAP: "false"
    RUN_SYNC_WORKER: "false"
    RUN_API_SCHEDULER: "false"
    DB_POOL_SIZE: "2"
    DB_MAX_OVERFLOW: "0"
    DB_POOL_TIMEOUT: "5"
    DB_STATEMENT_TIMEOUT_MS: "60000"
    DB_LOCK_TIMEOUT_MS: "10000"
    EXPECTED_SCHEMA_REVISION: ${ADMIRRA_SCHEMA_REVISION:?Set the tested migration head}
    TASK_LEASE_SECONDS: "120"
    SYNC_GLOBAL_CONCURRENCY: "4"
    SYNC_TENANT_CONCURRENCY: "2"
    LOG_TO_STDOUT: "true"
    UPLOADS_DIR: /data/uploads
    REJECTED_LEADS_DIR: /data/rejected-leads
    ARTIFACT_BASE_URL: https://10.77.0.1:9443
    ARTIFACT_CA_FILE: /run/artifact/ca.crt
    ARTIFACT_CERT_FILE: /run/artifact/client.crt
    ARTIFACT_KEY_FILE: /run/artifact/client.key
    ARTIFACT_TOKEN_FILE: /run/artifact/token
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs: [/tmp:size=256m]
  volumes:
    - type: volume
      source: shared-uploads
      target: /data/uploads
      read_only: true
      volume: {nocopy: true}
    - type: volume
      source: shared-rejected
      target: /data/rejected-leads
      volume: {nocopy: true}
    - /etc/admirra/worker-secrets:/app/secrets:ro
    - /etc/admirra/artifact-worker:/run/artifact:ro
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 55m
  pids_limit: 128
  mem_limit: 768m
  cpus: 1
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  depends_on:
    broker: {condition: service_healthy}
  networks: [work]

services:
  broker:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: [redis-server, /etc/redis/redis.conf]
    volumes:
      - /etc/admirra/redis-broker.conf:/etc/redis/redis.conf:ro
      - /etc/admirra/redis-broker-users.acl:/etc/redis/users.acl:ro
      - broker-data:/data
    # Only encrypted host-to-host address, never 0.0.0.0.
    ports: ["10.77.0.2:6379:6379"]
    env_file: /etc/admirra/redis-health.env
    healthcheck:
      test: [CMD-SHELL, "redis-cli --user health ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks: [work]
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
  cache:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: [redis-server, /etc/redis/redis.conf]
    volumes:
      - /etc/admirra/redis-cache.conf:/etc/redis/redis.conf:ro
      - /etc/admirra/redis-cache-users.acl:/etc/redis/users.acl:ro
    ports: ["10.77.0.2:6380:6379"]
    tmpfs: [/data:size=64m]
    env_file: /etc/admirra/redis-health.env
    healthcheck:
      test: [CMD-SHELL, "redis-cli --user health ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks: [work]
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
  sync-manual:
    <<: *worker
    command: [python, -m, automation.work_worker, --concurrency=2, --queues=sync.manual, --hostname=manual@%h]
    mem_limit: 1280m
    cpus: 1.5
  sync-nightly:
    <<: *worker
    command: [python, -m, automation.work_worker, --concurrency=2, "--queues=sync.nightly,sync.backfill", --hostname=nightly@%h]
    mem_limit: 1280m
    cpus: 1.5
  reports:
    <<: *worker
    command: [python, -m, automation.work_worker, --concurrency=1, --queues=reports, --hostname=reports@%h]
  maintenance:
    <<: *worker
    command: [python, -m, automation.work_worker, --concurrency=1, --queues=maintenance, --hostname=maintenance@%h]
  scheduler:
    <<: *worker
    command: [python, -m, automation.work_control]
    env_file:
      - path: /etc/admirra/scheduler.env
        format: raw
      - path: /etc/admirra/redis-worker.env
        format: raw
    volumes: []
    environment:
      <<: *runtime
      APP_PROCESS_ROLE: scheduler
      LEAD_ALERT_TIMEZONE: UTC
      # Prewarm is an optional expansion and stays off on the 8 GiB launch host.
      AI_PREWARM_ENABLED: "false"
    stop_grace_period: 60s
    mem_limit: 256m
    cpus: 0.5

volumes:
  broker-data:
  # Docker must mount NFS before starting a consumer: never fall back to an
  # empty local directory when the host mount/network is unavailable.
  shared-uploads:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.77.0.1,nfsvers=4.2,proto=tcp,hard,nosuid,nodev,noexec,ro
      device: ":/uploads"
  shared-rejected:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.77.0.1,nfsvers=4.2,proto=tcp,hard,nosuid,nodev,noexec
      device: ":/rejected-leads"
networks:
  work:
