# Only synthetic data; no host ports, production credentials or outbound network.
name: admirra-devops-test
services:
  test-db:
    image: postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated-test-only
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB"]
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "test"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [isolated]
  tests:
    image: admirra-devops:staging
    entrypoint: ["python", "-m", "ops.run_isolated_tests"]
    command:
      - --disable-warnings
      - tests/test_runtime_roles.py
      - tests/test_request_queue_lifecycle.py
      - tests/test_backend_packaging.py
      - tests/test_runtime_health.py
      - tests/test_api_role_boot.py
      - tests/test_sync_job_retry.py
      - tests/test_sync_detector_isolation.py
      - tests/test_metrika_goal_batch.py
      - tests/test_metrika_api_failure.py
      - tests/test_postgres_runtime_health.py
      - tests/test_economics_master.py
      - tests/test_billing_guards.py
      - tests/test_reports_final.py
      - tests/test_leads_delta.py
      - tests/test_ai_comment_prompt_v2.py
      - tests/test_detector_iteration3.py
      - tests/test_detector_novelty_iteration4.py
      - tests/test_vk_ads.py
      - tests/test_yandex_direct.py
      # Frontend sources are intentionally not part of the backend artifact.
      - -k
      - not frontend_does_not_call_sent_delivered
    environment:
      WW_TEST: "1"
      WW_TEST_ID: devops-postgres
      DATABASE_URL: postgresql://test:isolated-test-only@test-db:5432/test
      ISOLATED_POSTGRES_URL: postgresql://test:isolated-test-only@test-db:5432/test
    volumes:
      - ..:/app:ro
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      test-db:
        condition: service_healthy
    networks: [isolated]
networks:
  isolated:
    internal: true
