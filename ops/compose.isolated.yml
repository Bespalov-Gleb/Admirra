# Only synthetic data; no host ports, production credentials or outbound network.
name: admirra-devops-test
services:
  test-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    tmpfs: [/data:size=128m]
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [isolated]
  test-db:
    image: postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated-test-only
    # Synthetic schema-heavy tests must not inherit a 1GB WAL budget inside
    # a 512MB tmpfs. These are test-only settings, never production tuning.
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "checkpoint_timeout=30s", "-c", "checkpoint_completion_target=0.5", "-c", "shared_preload_libraries=pg_stat_statements"]
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "test"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [isolated]
  tests:
    image: ${TEST_IMAGE:-admirra-devops:staging}
    entrypoint: ["python", "-m", "ops.run_isolated_tests"]
    command:
      - --disable-warnings
      - tests/test_runtime_roles.py
      - tests/test_worker_pool_lifecycle.py
      - tests/test_worker_capacity.py
      - tests/test_db_read_audit.py
      - tests/test_db_statement_sample.py
      - tests/test_integration_list_queries.py
      - tests/test_durable_work.py
      - tests/test_sync_tenant_scope.py
      - tests/test_outbox_publication.py
      - tests/test_celery_recovery.py
      - tests/test_provider_transport.py
      - tests/test_private_link.py
      - tests/test_private_services.py
      - tests/test_public_report_links.py
      - tests/test_artifact_storage.py
      - tests/test_artifact_ledger.py
      - tests/test_report_artifacts.py
      - tests/test_request_queue_lifecycle.py
      - tests/test_backend_packaging.py
      - tests/test_runtime_health.py
      - tests/test_api_role_boot.py
      - tests/test_sync_job_retry.py
      - tests/test_sync.py
      - tests/test_sync_detector_isolation.py
      - tests/test_detector_hypothesis_work.py
      - tests/test_api2_canary_monitor.py
      - tests/test_api2_canary_nginx.py
      - tests/test_backup_receiver.py
      - tests/test_backup_retention.py
      - tests/test_restore_load_safety.py
      - tests/test_cutover_preflight.py
      - tests/test_cutover_admission.py
      - tests/test_external_heartbeat.py
      - tests/test_alertmanager_delivery.py
      - tests/test_peak_observer.py
      - tests/test_provider_peak_scope.py
      - tests/test_assistant_files.py
      - tests/test_assistant_streaming.py
      - tests/test_assistant_provider_limits.py
      - tests/test_assistant_vk_reporting.py
      - tests/test_billing_slot_purchase.py
      - tests/test_mobile_plan_progress.py
      - tests/test_team_router.py
      - tests/test_vk_client_link.py
      - tests/test_yandex_integration_oauth.py
      - tests/test_metrika_goal_batch.py
      - tests/test_metrika_goal_work.py
      - tests/test_metrika_api_failure.py
      - tests/test_postgres_runtime_health.py
      - tests/test_economics_master.py
      - tests/test_billing_guards.py
      - tests/test_reports_final.py
      - tests/test_report_route_guards.py
      - tests/test_shared_read_cache.py
      - tests/test_summary_queries.py
      - tests/test_avito_summary_cpl.py
      - tests/test_backfill_work.py
      - tests/test_leads_delta.py
      - tests/test_ai_comment_prompt_v2.py
      - tests/test_detector_iteration3.py
      - tests/test_detector_novelty_iteration4.py
      - tests/test_vk_ads.py
      - tests/test_yandex_direct.py
      # Frontend sources are intentionally not part of the backend artifact.
      - -k
      - not frontend_does_not_call_sent_delivered
    environment:
      WW_TEST: "1"
      WW_TEST_ID: devops-postgres
      DATABASE_URL: postgresql://test:isolated-test-only@test-db:5432/test
      ISOLATED_POSTGRES_URL: postgresql://test:isolated-test-only@test-db:5432/test
      ISOLATED_REDIS_URL: redis://test-redis:6379/15
    volumes:
      - ..:/app:ro
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      test-redis:
        condition: service_healthy
      test-db:
        condition: service_healthy
    networks: [isolated]
networks:
  isolated:
    internal: true
