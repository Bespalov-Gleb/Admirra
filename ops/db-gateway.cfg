global
    maxconn 80
    log stdout format raw local0 notice

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout queue 5s
    option clitcpka
    option srvtcpka

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend private_postgres
    bind :5432
    default_backend postgres

backend postgres
    server primary db:5432 check inter 5s resolvers docker resolve-prefer ipv4 init-addr libc,none
