error_page 418 = @admirra_cutover_admission_closed;
if ($admirra_cutover_block) {
    return 418;
}

location @admirra_cutover_admission_closed {
    internal;
    default_type application/json;
    add_header Retry-After "60" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-AdMirra-Admission "closed" always;
    return 503 '{"detail":"Фоновые операции временно приостановлены. Повторите через минуту.","code":"cutover_drain"}';
}
