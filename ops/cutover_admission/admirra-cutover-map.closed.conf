map "$request_method:$uri" $admirra_cutover_block {
    default 0;

    # Long-running, paid or externally visible operations only. Auth, normal
    # dashboard reads, billing callbacks and lead webhooks stay available.
    ~^(POST|PUT|PATCH|DELETE):/api/assistant(?:/|$) 1;
    ~^POST:/api/ai/(?:chat|generate-report|comment)(?:/|$) 1;
    ~^(POST|PUT|PATCH|DELETE):/api/reports(?:/|$) 1;
    ~^POST:/api/integrations/sync/jobs$ 1;
    ~^POST:/api/integrations/[^/]+/sync$ 1;
    ~^POST:/api/dashboard/dynamics/backfill$ 1;
}
