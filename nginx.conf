server {
    listen 80;
    server_name localhost;

    # Docker DNS: резолвим имя backend на каждый запрос (valid=10s), а не один раз
    # при старте nginx — иначе после пересоздания backend-контейнера его IP меняется
    # и nginx бьёт в старый адрес (502 на /uploads и /api до рестарта frontend).
    # По этой же причине здесь НЕТ upstream-блока с keepalive: upstream резолвит
    # имя один раз при старте и возвращает тот самый баг с 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8001;

    # Сжатие. Раньше не было включено нигде: ни здесь, ни на хостовом nginx
    # (там gzip_proxied по умолчанию off, поэтому ответы апстрима не сжимались).
    # JSON статистики сжимается в 8-10 раз, JS+CSS бандл — примерно вчетверо.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # Vite отдаёт бандлы с хэшем в имени — их можно кэшировать навсегда.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Статические файлы нового лендинга живут в отдельном namespace и не
    # пересекаются с хэшированными Vite-бандлами в /assets/.
    location ^~ /landing-new/assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html кэшировать нельзя: иначе после деплоя браузер продолжит тянуть
    # старые имена бандлов из /assets/.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Главная отдаётся как готовый статический HTML, без Vue и iframe. alias
    # сохраняет канонический URL /, но сразу возвращает H1, тексты и JSON-LD.
    location = / {
        root /usr/share/nginx/html;
        try_files /landing-new/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Внутренний путь бандла не должен индексироваться как дубль главной.
    location = /landing-new/index.html {
        return 301 /;
    }

    # Разрешённые маршруты клиентского Vue-приложения. Все они получают
    # noindex; неизвестные URL ниже возвращают настоящий HTTP 404.
    location ~ ^/(?:signin|signup|reset-password|two-step-verification|verify-email|pending-email-verification|auth|login|register|forgot-password|dashboard|products|projects|phone-api|phone-integration|phone-projects|phone-leads|phone-stats|phone-reports|channels|team|history|tariffs|settings|help|ai-analysis|reports|profile|integrations|preview-banner|main|create|project-rows|project-card|ads-channel|integration-[1-4])(?:/.*)?$ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Остальная статика отдаётся как файл. SPA-fallback намеренно убран из
    # catch-all: несуществующая страница должна иметь статус 404, а не 200.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Proxy API requests to backend
    # proxy_pass без URI-части: с переменной nginx передаёт исходный путь как есть
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отчёты (PDF/XLSX) и AI-генерация идут дольше дефолтных 60 с —
        # без этого клиент получает 504 на длинных запросах.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        client_max_body_size 32m;
    }

    # ^~ обязателен: иначе загруженные картинки (аватарки .png/.jpg) перехватывает
    # regex-локация \.(png|jpg|...)$ выше и ищет их в статике фронта → 404.
    # ^~ говорит nginx: при совпадении этого префикса regex-локации не проверять.
    location ^~ /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        expires 7d;
        add_header Cache-Control "public";
    }
}
